<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e2a38">
<meta name="mobile-web-app-capable" content="yes">
<title>Gün Defteri</title>
<style>
:root{--fs:18px}
body[data-theme="acik"]{--bg:#f4f1ea;--panel:#fffdf8;--txt:#1f2328;--sub:#5d6670;--line:#d8d2c4;--acc:#1f6feb;--top:#1e2a38;--toptxt:#fff;--ok:#2e7d32;--bad:#c62828;--hl:#ffe08a}
body[data-theme="koyu"]{--bg:#121417;--panel:#1b1f24;--txt:#e6e6e6;--sub:#9aa4ae;--line:#2d333b;--acc:#58a6ff;--top:#0b0d10;--toptxt:#e6e6e6;--ok:#4caf50;--bad:#ef5350;--hl:#6b5300}
body[data-theme="sepya"]{--bg:#efe3c8;--panel:#f8efd9;--txt:#3b2f1e;--sub:#7a6748;--line:#d6c39b;--acc:#8a5a00;--top:#5b4220;--toptxt:#fff6e0;--ok:#4d7c0f;--bad:#b23b1e;--hl:#f3c969}
body[data-theme="yesil"]{--bg:#e6efe6;--panel:#f3f8f2;--txt:#1d2b1f;--sub:#567058;--line:#bfd3bf;--acc:#2e7d32;--top:#24452a;--toptxt:#fff;--ok:#2e7d32;--bad:#c62828;--hl:#d4ec9a}
body[data-theme="gri"]{--bg:#e9ebee;--panel:#f7f8fa;--txt:#22262b;--sub:#5f6873;--line:#cfd4da;--acc:#3d6fb6;--top:#3a4350;--toptxt:#fff;--ok:#2e7d32;--bad:#c62828;--hl:#ffe08a}
body[data-theme="mavi"]{--bg:#e6eef7;--panel:#f5f9fd;--txt:#18263a;--sub:#53657d;--line:#c3d3e6;--acc:#1f6feb;--top:#1b3a63;--toptxt:#fff;--ok:#2e7d32;--bad:#c62828;--hl:#ffe08a}
body[data-theme="lavanta"]{--bg:#efeaf6;--panel:#faf7fd;--txt:#2a2236;--sub:#6b5f7d;--line:#d9cfe7;--acc:#7b4fd6;--top:#3f2d63;--toptxt:#fff;--ok:#2e7d32;--bad:#c62828;--hl:#ffe08a}
body[data-theme="kum"]{--bg:#f2ead9;--panel:#fbf6ea;--txt:#2f281c;--sub:#76684d;--line:#dfd2b3;--acc:#a0522d;--top:#4a3b26;--toptxt:#fff4dc;--ok:#4d7c0f;--bad:#b23b1e;--hl:#f3c969}
body[data-theme="gece"]{--bg:#0f1a2a;--panel:#162338;--txt:#dfe7f2;--sub:#93a4bd;--line:#2a3b55;--acc:#5aa9ff;--top:#0a1220;--toptxt:#dfe7f2;--ok:#5fd17a;--bad:#ff6b6b;--hl:#5a4a00}
body[data-theme="kontrast"]{--bg:#000;--panel:#000;--txt:#fff;--sub:#ffeb3b;--line:#888;--acc:#00e5ff;--top:#000;--toptxt:#ffeb3b;--ok:#00e676;--bad:#ff5252;--hl:#7a6a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4em .5em}
/* Üst menü */
#top{font-size:min(var(--fs),19px);display:flex;align-items:center;gap:.1em;background:linear-gradient(135deg,var(--top) 0%,color-mix(in srgb,var(--top) 72%,var(--acc)) 100%);color:var(--toptxt);flex:0 0 auto;padding:calc(env(safe-area-inset-top) + .55em) .3em .45em;border-bottom:3px solid var(--acc);box-shadow:0 3px 10px #0004}
.tr1{display:flex;align-items:center;height:2.5em}.tr2{display:flex;align-items:stretch;height:2.5em;background:#ffffff14;border-top:1px solid #ffffff22}
.tr2 button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:.05em}
.tr2 small{font-size:.62em;opacity:.85}
#top button{height:2.7em;padding:0 .45em;font-size:1.05em;color:var(--toptxt);border-radius:10px}
#top button:active{background:#ffffff22}
#dateBtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;overflow:hidden}
#dateBtn .brand{font-size:.58em;letter-spacing:.04em;opacity:.85;font-weight:700;white-space:nowrap}
#dateBtn .dbig{font-size:1.22em;font-weight:800;white-space:nowrap;letter-spacing:.01em}
#dateBtn .tb{background:var(--acc);color:#fff;border-radius:6px;padding:0 .35em;margin-left:.3em;letter-spacing:.05em}
#dateBtn small{font-weight:400;opacity:.8}
#todayBtn.hide{display:none}
#menuBtn{background:var(--acc)!important;color:#fff!important;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 .75em!important;margin-left:.15em;box-shadow:0 2px 6px #0005;border:1px solid #ffffff40}
#menuBtn .hb{font-size:1.35em}#menuBtn small{font-size:.55em;font-weight:800;letter-spacing:.08em;margin-top:.1em}
/* İçerik */
#main{flex:1;overflow:auto;padding:.4em .4em 3em}
.row{background:var(--panel);border:1px solid var(--line);border-top:0;display:flex;align-items:center;min-height:2.6em}
.row:first-child,.hdr+.row{border-top:1px solid var(--line)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:.7em 0 0;padding:.25em .3em;font-weight:700;color:var(--sub);font-size:.85em;text-transform:uppercase;letter-spacing:.03em}
.hdr button{color:var(--acc);font-weight:700;text-transform:none;font-size:1.05em;padding:.2em .5em}
.hdr:first-child{margin-top:0}
#dayText{width:100%;min-height:6.5em;border:1px solid var(--line);border-radius:0;resize:vertical;line-height:1.45;display:block;background:var(--panel)}
.chk{width:1.5em;height:1.5em;margin:0 .6em;accent-color:var(--ok);flex:0 0 auto}
.row .t{flex:1;padding:.4em .2em;word-break:break-word}
.row.done .t{text-decoration:line-through;color:var(--sub)}
.row .meta{font-size:.75em;color:var(--sub);padding-right:.4em;white-space:nowrap}
.row .late{color:var(--bad);font-weight:700}
.row .x{color:var(--sub);padding:.3em .6em;font-size:1.1em}
.empty{color:var(--sub);font-style:italic;padding:.6em .8em}
#files{display:flex;flex-wrap:wrap;gap:.4em;padding:.4em;background:var(--panel);border:1px solid var(--line)}
.thumb{width:5.5em;height:5.5em;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:.7em;text-align:center}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:.95em;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb b{font-size:2em}
/* Modallar */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:2.8em .4em .4em}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:44em;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.box h3{margin:0;padding:.5em .7em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:1em}
.box h3 button{font-size:1.3em;padding:0 .3em}
.box .bd{overflow:auto;padding:.6em}
.btn{background:var(--acc);color:#fff;border-radius:6px;padding:.45em .9em;font-weight:600}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.red{background:var(--bad)}
/* Menü */
#menu{padding:0;align-items:stretch}
#menuBox{margin-left:auto;max-width:23em;height:100%;max-height:100%;border-radius:0;border:0;animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(40%);opacity:.3}to{transform:none;opacity:1}}
#menuBox h3{background:var(--top);color:var(--toptxt);padding:calc(env(safe-area-inset-top) + .6em) .8em .6em}
#menuBox h3 button{color:var(--toptxt)}
.msec{font-size:.75em;font-weight:800;color:var(--acc);letter-spacing:.08em;margin:.7em .2em .35em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr));gap:.35em}
.mgrid button{border:2px solid var(--line);border-radius:10px;padding:.5em .45em;text-align:left;background:var(--bg);font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgrid button b{color:var(--acc);margin-right:.35em}
.mlist button{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;padding:.75em .5em;border-bottom:1px solid var(--line);font-size:1.02em}
.mlist button i{font-style:normal;font-size:1.3em;width:1.6em;text-align:center}
.mlist button small{display:block;color:var(--sub);font-size:.75em}
/* Takvim */
.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4em}
.calHead button{font-size:1.3em;padding:.1em .7em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal div{text-align:center;padding:.55em 0;border-radius:6px;position:relative}
.cal .wd{color:var(--sub);font-size:.8em;font-weight:700}
.cal .d{background:var(--bg);cursor:pointer}
.cal .d.today{outline:2px solid var(--acc)}
.cal .d.sel{background:var(--acc);color:#fff}
.cal .d.has::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ok)}
.cal .d.note::before{content:"";position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
/* Arama */
#q{width:100%;font-size:1.1em}
.sum{background:var(--bg);border-left:4px solid var(--acc);padding:.5em .7em;margin:.6em 0;line-height:1.5}
.res{border-bottom:1px solid var(--line);padding:.5em .2em;display:flex;gap:.5em;align-items:flex-start}
.res .dt{font-weight:700;white-space:nowrap;color:var(--acc);min-width:6.2em}
.res .tp{font-size:.72em;border:1px solid var(--line);border-radius:4px;padding:0 .3em;color:var(--sub);white-space:nowrap}
.res .tx{flex:1;word-break:break-word}
mark{background:var(--hl);color:inherit}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:.4em .45em;text-align:center}
th:first-child,td:first-child{text-align:left}
th{background:var(--bg);font-size:.85em}
/* Kamera */
#cam{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}
#cam.on{display:flex}
#camV{flex:1;width:100%;height:100%;object-fit:contain;background:#000}
#camBar{display:flex;justify-content:space-around;align-items:center;padding:.6em .3em calc(.6em + env(safe-area-inset-bottom));background:#000}
#camBar button{color:#fff;font-size:1.1em;padding:.4em .6em}
#shot{width:3.6em;height:3.6em;border-radius:50%;border:4px solid #fff;background:#fff3}
#rec{width:3.6em;height:3.6em;border-radius:50%;border:4px solid #fff;background:#d32f2f}
#rec.on{border-radius:12px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.5}}
#camInfo{position:absolute;top:calc(.5em + env(safe-area-inset-top));left:.5em;color:#fff;background:#0008;padding:.2em .5em;border-radius:6px;font-size:.85em}
#camV{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camV.mir{transform:scaleX(-1)}
#camTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:calc(env(safe-area-inset-top) + .7em) .7em 1.2em;background:linear-gradient(#000b,#0000);z-index:2}
#camTop button{color:#fff;font-size:1.15em;height:2.5em;min-width:2.5em;padding:0 .8em;border-radius:1.3em;background:#0007;border:1px solid #fff5}
#torchBtn{font-weight:800;letter-spacing:.03em}
#torchBtn.on{background:#ffcc00!important;color:#000!important;border-color:#ffcc00!important;box-shadow:0 0 14px #ffcc0099}
#camInfo{top:calc(env(safe-area-inset-top) + 4.4em)!important;left:50%!important;transform:translateX(-50%);color:#ffcc00!important;font-weight:700;white-space:nowrap;z-index:2}
#zoomBox{position:absolute;left:6%;right:6%;bottom:9.8em;display:none;align-items:center;gap:.5em;color:#fff;z-index:2;background:#0006;border-radius:2em;padding:.3em .6em}
#zoomBox input{flex:1;accent-color:#ffcc00}#zoomBox button{color:#fff;font-size:1.3em;width:1.6em}#zoomBox b{min-width:3em;text-align:right;color:#ffcc00}
#camBar{position:absolute!important;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:1.2em .5em calc(1.3em + env(safe-area-inset-bottom))!important;background:linear-gradient(#0000,#000d)!important;z-index:2}
.cb{display:flex;flex-direction:column;align-items:center;gap:.35em;color:#fff;min-width:5em}.cb small{font-size:.7em;font-weight:700;letter-spacing:.08em;opacity:.85}
#shot{width:5em!important;height:5em!important;border-radius:50%;border:5px solid #fff!important;background:#fff!important;box-shadow:inset 0 0 0 4px #000}
#shot:active{transform:scale(.9)}
#rec{width:3.6em!important;height:3.6em!important;border-radius:50%;border:4px solid #fff!important;background:transparent!important;display:flex;align-items:center;justify-content:center;padding:0!important}
#rec span{width:1.7em;height:1.7em;border-radius:50%;background:#e53935;transition:.2s}
#rec.on{animation:none!important;border-radius:50%!important}#rec.on span{border-radius:5px;width:1.3em;height:1.3em;animation:bl 1s infinite}
#lastShot{width:3.4em;height:3.4em;border-radius:10px;border:2px solid #fff;overflow:hidden;background:#222}
#lastShot img{width:100%;height:100%;object-fit:cover}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#viewer .bd{padding:0;display:flex;justify-content:center;background:#000}
#viewer img,#viewer video{max-width:100%;max-height:75vh}
#viewer iframe{width:100%;height:75vh;border:0;background:#fff}
.vbar{display:flex;gap:.5em;padding:.5em;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.vbar input{flex:1;min-width:8em}
.mt td,.mt th{padding:.35em .3em;font-size:.88em;white-space:nowrap}
.mt td:first-child,.mt th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.mt .pd{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok);font-weight:700;cursor:pointer}
.mt .ld{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad);font-weight:700;cursor:pointer}
.mt .fu{color:var(--sub);cursor:pointer}
.mt .na{background:var(--bg)}
.mt small{font-weight:400}
.mt .tot td{font-weight:700;background:var(--bg)}
.gelir{color:var(--ok)}.gider{color:var(--bad)}
.fl{display:flex;gap:.5em;align-items:center;margin:.45em 0;flex-wrap:wrap}.fl label{min-width:6.5em}
.tabs{display:flex;gap:.3em;margin-bottom:.5em;flex-wrap:wrap}.tabs button{padding:.4em .8em;border:1px solid var(--acc);border-radius:6px;color:var(--acc)}.tabs button.on{background:var(--acc);color:#fff}
.bdg{font-size:.72em;border-radius:4px;padding:0 .35em;margin-left:.3em;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.bdg.kart{border-color:#7b4fd6;color:#7b4fd6}
.lg td{text-align:left}.lg td.n{text-align:right;white-space:nowrap}.lg tr[data-g]{cursor:pointer}
.daysum{font-size:.82em;color:var(--sub);padding:.3em .6em;background:var(--panel);border:1px solid var(--line);border-top:0}
.daysum{border-top:1px solid var(--line)}
#fbar{display:flex;align-items:center;gap:.3em;padding:.3em;background:var(--panel);border:1px solid var(--line);border-top:0;overflow-x:auto}
#fbar>button{font-size:1.35em;padding:.15em .35em;border:1px solid var(--line);border-radius:8px;flex:0 0 auto}
#fbar #files{display:flex;gap:.3em;flex:0 0 auto;padding:0;border:0;background:none;flex-wrap:nowrap}
.lg{font-size:.9em}
#files .thumb{width:4.4em;height:4.4em;font-size:.6em;cursor:pointer}
#files .thumb span{display:none}
#files .thumb .del{position:absolute;top:2px;right:2px;width:1.6em;height:1.6em;border-radius:50%;background:#e53935;color:#fff;font-size:1.1em;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0008;z-index:2;border:2px solid #fff}
#files.big{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:.45em;flex-basis:100%;padding:.2em 0}
#files.big .thumb{width:100%;height:auto;aspect-ratio:1;font-size:.85em;border-radius:10px}
#files.big .thumb span{display:none}
#files.big .thumb .del{width:2em;height:2em;font-size:1.05em;top:5px;right:5px}
#files .thumb.vid b{position:absolute;color:#fff;text-shadow:0 0 6px #000}
#files .thumb.away{background:var(--bg);color:var(--sub)}
#mHandle{flex-basis:100%;display:none;flex-direction:column;align-items:center;cursor:pointer;color:var(--sub);font-size:.72em;padding:.15em 0 0;touch-action:none;user-select:none}
#mHandle i{width:3em;height:5px;border-radius:3px;background:var(--line);margin-bottom:.15em}
#mHandle.on{display:flex}
.vact{display:flex;gap:.5em;align-items:center}
.vact button{font-size:.85em!important;padding:.35em .8em!important;border-radius:18px;font-weight:700}
.vdel{background:var(--bad);color:#fff}.vx{border:2px solid var(--line)}
.utoast{position:fixed;left:50%;bottom:1.5em;transform:translateX(-50%);background:#222;color:#fff;padding:.4em .5em .4em 1em;border-radius:24px;z-index:99;display:none;align-items:center;gap:.8em;box-shadow:0 4px 14px #0006}
.utoast.on{display:flex}.utoast span{max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.utoast button{white-space:nowrap;background:#ffcc00;color:#000;font-weight:800;border-radius:16px;padding:.35em .9em}
#quick{margin-top:.8em;background:var(--panel);border:2px solid var(--acc);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0002}
.qhead{background:var(--acc);color:#fff;padding:.4em .7em;font-weight:800;display:flex;justify-content:space-between;align-items:center;letter-spacing:.03em}
#qTot{font-weight:700;font-size:.9em;background:#ffffff2a;border-radius:8px;padding:.05em .5em;letter-spacing:0}
.qsec{padding:.4em .55em .55em}
.qlbl{font-size:.78em;font-weight:800;color:var(--acc);margin-bottom:.25em}.qlbl small{font-weight:400;color:var(--sub)}
.qwhere{background:color-mix(in srgb,var(--acc) 9%,var(--panel));max-height:60em;transition:max-height .28s ease,padding .28s ease,opacity .2s;overflow:hidden}
#quick.shut .qwhere{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
#quick.shut .qamt{border-top:0}
#qTot:empty{display:none}
#qTog{color:#fff;font-size:1em;width:1.8em;height:1.6em;border-radius:8px;background:#ffffff2a;transition:transform .25s}
#quick:not(.shut) #qTog{transform:rotate(180deg)}
#qSel{font-size:.75em;color:var(--sub);margin-left:.3em}
.qwhere .chip{background:var(--panel);border:2px solid var(--line);min-width:2.7em;font-size:.95em;padding:.15em .3em .2em}
.qwhere .chip.on{background:var(--acc);border-color:var(--acc)}
.qamt{background:var(--bg);border-top:2px dashed color-mix(in srgb,var(--acc) 40%,var(--line))}
.qamt input{border:2px solid var(--line);border-radius:8px;font-size:1.05em;padding:.45em .5em;background:var(--panel)}
.qamt input:focus{outline:none;border-color:var(--acc)}
#qR{flex:0 0 auto;min-width:2.6em;height:2.5em;border:2px solid var(--acc);border-radius:8px;color:var(--acc);font-weight:900;font-size:1.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#qR small{font-size:.55em;font-weight:700}
#qOk{height:2.5em;padding:0 .9em;font-size:1.1em}
.qrow{display:flex;gap:.3em;align-items:center}.qi{font-size:1.2em}
#qA{flex:1;min-width:0;font-weight:800;font-size:1.2em!important;text-align:center}
#qD{display:block;width:100%;margin-top:.4em;min-height:3.4em;resize:vertical;line-height:1.4;border:2px solid var(--line);border-radius:8px;font-size:1.02em;padding:.45em .5em;background:var(--panel);font-family:inherit}
#qD:focus{outline:none;border-color:var(--acc)}#qOk{padding:.4em .7em}
.chips{display:flex;gap:.3em;flex-wrap:wrap;margin-top:.35em;align-items:stretch}
.chip{display:flex;flex-direction:column;align-items:center;min-width:2.3em;border:1px solid var(--line);border-radius:7px;padding:.1em .25em .15em;font-size:.82em;font-weight:800;cursor:pointer;user-select:none}

<script>
/* ========== Yardımcılar ========== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const trDate=k=>{const d=parseKey(k);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const low=s=>(s||'').toLocaleLowerCase('tr');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
const todayKey=()=>key(new Date());

/* ========== Veritabanı (IndexedDB) ========== */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('gunDefteri',4);
 r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
  if(!has('days'))d.createObjectStore('days',{keyPath:'date'});
  if(!has('notes')){const n=d.createObjectStore('notes',{keyPath:'id'});n.createIndex('date','date')}
  if(!has('files')){const f=d.createObjectStore('files',{keyPath:'id'});f.createIndex('date','date')}
  if(!has('pays'))d.createObjectStore('pays',{keyPath:'id'});
  if(!has('money')){const m=d.createObjectStore('money',{keyPath:'id'});m.createIndex('date','date')}
  if(!has('audio'))d.createObjectStore('audio',{keyPath:'date'});};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const get=(s,k)=>tx(s,'readonly',st=>st.get(k));
const putRaw=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const delRaw=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
// değişiklik takibi (senkron için): her kayıt _u zamanı alır, silinenler mezar listesine yazılır
const SYNC=['days','notes','money','files','audio'],KP={days:'date',notes:'id',money:'id',files:'id',audio:'date'};
function tombs(){try{return JSON.parse(localStorage.getItem('gd_tomb')||'[]')}catch(e){return[]}}
function setTombs(t){localStorage.setItem('gd_tomb',JSON.stringify(t))}
const put=(s,v)=>{if(SYNC.includes(s)){v._u=Date.now();const k=String(v[KP[s]]),t=tombs(),t2=t.filter(x=>!(x.s===s&&x.k===k));if(t2.length!==t.length)setTombs(t2);syncSoon()}return putRaw(s,v)};
const del=(s,k)=>{if(SYNC.includes(s)){const t=tombs().filter(x=>!(x.s===s&&x.k===String(k)));t.push({s,k:String(k),u:Date.now()});setTombs(t);syncSoon()}return delRaw(s,k)};

/* ========== ☁ Firebase senkron — ücretsiz plan, kütüphanesiz (REST) ========== */
const FB=JSON.parse(localStorage.getItem('gd_fb')||'null')||{};
// Emre'nin Firebase projesi (gömülü — her cihazda yapıştırmaya gerek yok)
if(!FB.apiKey){FB.apiKey='AIzaSyDPTOBhbmMnscX6dVGdAi7KZ0h2Cj2xNM8';FB.projectId='gun-defteri'}
const saveFB=()=>localStorage.setItem('gd_fb',JSON.stringify(FB));
let syncing=false,syncTimer=null,syncState=FB.uid?'off':'',syncMsg='';
function syncSoon(){if(!FB.uid)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),4000)}
function parseCfg(t){const g=k=>{const m=String(t).match(new RegExp(k+`["']?\\s*[:=]\\s*["']([^"']+)`));return m&&m[1]};return{apiKey:g('apiKey'),projectId:g('projectId')}}
function fbErr(m){m=String(m||'');const T={EMAIL_EXISTS:'Bu e-postayla hesap zaten var — "Giriş yap"a bas',INVALID_LOGIN_CREDENTIALS:'E-posta veya şifre yanlış',INVALID_PASSWORD:'Şifre yanlış',
 EMAIL_NOT_FOUND:'Bu e-postayla hesap yok — "Yeni hesap oluştur"a bas',INVALID_EMAIL:'E-posta adresi hatalı',WEAK_PASSWORD:'Şifre en az 6 karakter olmalı',MISSING_PASSWORD:'Şifre yaz',
 OPERATION_NOT_ALLOWED:"Firebase'de E-posta/Şifre girişi açılmamış (Kurulum adım 3)",CONFIGURATION_NOT_FOUND:"Firebase'de Authentication açılmamış (Kurulum adım 3)",
 'API key not valid':'apiKey hatalı — firebaseConfig kısmını tekrar yapıştır',TOO_MANY_ATTEMPTS_TRY_LATER:'Çok fazla deneme, biraz bekle'};
 for(const k in T)if(m.includes(k))return T[k];return m||'Bilinmeyen hata'}
async function fbAuth(path,body){
 const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,returnSecureToken:true})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(fbErr(j.error&&j.error.message));
 Object.assign(FB,{uid:j.localId,email:j.email,idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+((+j.expiresIn||3600)-60)*1000});saveFB()}
async function token(){if(FB.idToken&&Date.now()<FB.exp)return FB.idToken;
 const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(FB.refresh)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('Oturum süresi doldu — ☁ Senkron ekranından tekrar giriş yap');
 Object.assign(FB,{idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+((+j.expires_in||3600)-60)*1000});saveFB();return FB.idToken}
const FSB=()=>`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const docName=p=>`projects/${FB.projectId}/databases/(default)/documents/users/${FB.uid}/${p}`;
async function fsReq(method,url,body){
 const r=await fetch(url,{method,headers:{'Authorization':'Bearer '+await token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=j.error||(Array.isArray(j)&&j[0]&&j[0].error)||{},m=(e.status||'')+' '+(e.message||r.status);
  throw new Error(/PERMISSION_DENIED/.test(m)?'İzin yok — Firestore kuralları yapıştırılmamış (Kurulum adım 5)':/NOT_FOUND/.test(m)&&/database/i.test(m)?'Firestore veritabanı oluşturulmamış (Kurulum adım 4)':m)}
 return j}
const CH=600000;
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function shrinkImg(blob){try{const bm=await createImageBitmap(blob),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close&&bm.close();
 return await new Promise(r=>c.toBlob(r,'image/jpeg',0.75))}catch(e){return blob}}
async function upBlob(bid,blob){const u=new Uint8Array(await blob.arrayBuffer()),n=Math.max(1,Math.ceil(u.length/CH));
 for(let i=0;i<n;i++)await fsReq('POST',FSB()+':commit',{writes:[{update:{name:docName('blobs/'+bid+'_'+i),fields:{d:{bytesValue:u8b64(u.subarray(i*CH,(i+1)*CH))}}}}]});return n}
async function downBlob(bid,n,type){const parts=[];for(let i=0;i<n;i++){const j=await fsReq('GET',FSB()+'/users/'+FB.uid+'/blobs/'+encodeURIComponent(bid+'_'+i));parts.push(b64u8(j.fields.d.bytesValue))}return new Blob(parts,{type})}
let pendW=[];
const recWrite=(id,s,k,u,isDel,meta)=>({update:{name:docName('recs/'+id),fields:{s:{stringValue:s},k:{stringValue:k},u:{integerValue:String(u)},del:{booleanValue:!!isDel},j:{stringValue:isDel?'':JSON.stringify(meta)}}},updateTransforms:[{fieldPath:'st',setToServerValue:'REQUEST_TIME'}]});
async function flushW(force){while(pendW.length&&(force||pendW.length>=100)){const w=pendW.splice(0,100);await fsReq('POST',FSB()+':commit',{writes:w})}}
async function pushAll(){
 const t0=Date.now(),last=+localStorage.gd_lastPush||0;let n=0;pendW=[];
 for(const s of SYNC)for(const v of await all(s)){if((v._u||1)<=last)continue;
  const k=String(v[KP[s]]),id=s+'~'+k,meta={...v};
  if(s==='files'){delete meta.blob;
   if(v.blob&&!String(v.type).startsWith('video/')&&v.blob.size<8e6){const b=String(v.type).startsWith('image/')?await shrinkImg(v.blob):v.blob;meta._bn=await upBlob(id,b);meta._bt=b.type||v.type}
   else meta._nob=true}
  if(s==='audio'){meta.segs=[];for(let i=0;i<v.segs.length;i++){const{blob,...g}=v.segs[i];g._bn=blob?await upBlob(id+'_s'+i,blob):0;meta.segs.push(g)}}
  pendW.push(recWrite(id,s,k,v._u||1,false,meta));n++;await flushW(false)}
 const sj=JSON.stringify({tags:S.tags,routines:S.routines});
 if(sj!==(localStorage.gd_setj||'')){S._su=Date.now();saveS();pendW.push(recWrite('set~S','set','S',S._su,false,JSON.parse(sj)));localStorage.gd_setj=sj;n++}
 const tb=tombs();tb.forEach(t=>{pendW.push(recWrite(t.s+'~'+t.k,t.s,t.k,t.u,true,null));n++});
 await flushW(true);
 setTombs(tombs().filter(x=>x.u>t0));localStorage.gd_lastPush=t0;return n}
async function pullAll(){
 let last=localStorage.gd_lastSt||'1970-01-01T00:00:00Z',changed=0;
 for(let page=0;page<50;page++){
  const res=await fsReq('POST',FSB()+'/users/'+FB.uid+':runQuery',{structuredQuery:{from:[{collectionId:'recs'}],
   where:{fieldFilter:{field:{fieldPath:'st'},op:'GREATER_THAN',value:{timestampValue:last}}},orderBy:[{field:{fieldPath:'st'},direction:'ASCENDING'}],limit:200}});
  const docs=res.filter(r=>r.document);
  for(const r of docs){const f=r.document.fields,st=f.st.timestampValue;if(Date.parse(st)>=Date.parse(last))last=st;
   const s=f.s.stringValue,k=f.k.stringValue,u=+f.u.integerValue,isDel=f.del&&f.del.booleanValue;

 bufs.forEach(b=>{const src=off.createBufferSource();src.buffer=b;src.connect(off.destination);src.start(t);t+=b.duration});
 return (await off.startRendering()).getChannelData(0);
}
const f2i16=f=>{const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*0x8000:v*0x7fff}return o};
function wavBlob(i16,rate){const b=new ArrayBuffer(44+i16.length*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+i16.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,i16.length*2,true);
 new Int16Array(b,44).set(i16);return new Blob([b],{type:'audio/wav'})}

// S.tags: [{k, code, name, kart}]  N=Nakit ve K=Kart sabit; diğerlerini kullanıcı ekler

function chipList(){return [...S.tags.map(t=>({t:t.k,label:t.code,name:t.name,cls:t.k==='N'?'c-n':t.k==='K'?'c-k':''})),

function drawChips(box,sel,tools){
 box.innerHTML=chipList().map(c=>c.sep?'<span class="sep"></span>':`<label class="chip ${c.cls} ${sel.includes(c.t)?'on':''}" title="${esc(c.name)}">${esc(c.label)}<input type="checkbox" data-t="${c.t}" ${sel.includes(c.t)?'checked':''}></label>`).join('')+
  (tools?'<span class="sep"></span><button class="chip tool" id="qSet" title="Kutucukları ayarla">⚙</button>':'');

function parseAmt(v){v=String(v||'').replace(/tl|₺|\s/gi,'');if(!v)return NaN;
 const neg=/^[-−]/.test(v);v=v.replace(/^[-+−]/,'');
 if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/\.\d{3}($|\.)/.test(v))v=v.replace(/\./g,'');
 const n=parseFloat(v);return isNaN(n)?NaN:(neg?-n:n)}
const TL=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=n=>(n>0?'+':n<0?'−':'')+TL(Math.abs(n))+' ₺';
// etiketleri tamamla: kart türü kutucuk → K da eklenir; kart yoksa N eklenir
// kayıt tam olarak işaretlenen kutucuklara gider; hiç işaret yoksa (yeni kayıtta) Nakit
function fullTags(t){t=[...new Set(t.filter(x=>x!=='H'&&x!=='E'&&!x.startsWith('m:')))];return t}
const newTags=t=>{t=fullTags(t);return t.includes('N')||t.includes('K')?t:['N',...t]};
function derive(m){
 let t=m.tags||(m.method==='kart'?['K']:[]);const old=t.includes('H')||m.kind==='harcama';
 t=m.tags?fullTags(t):newTags(t);let v=parseAmt(m.amount)||0;if(old&&v>0)v=-v;
 return {tags:t,val:v,inc:v>0,kind:v>0?'gelir':'harcama',method:t.includes('K')?'kart':'nakit'}}

 (await all('pays')).forEach(p=>{const it=S.monthly.find(i=>i.id===p.item);if(!it)return;const a=Math.abs(parseAmt(p.amount)||0),inc=it.type!=='gider';
  const t=fullTags(p.tags||[...(p.method==='kart'?['K']:[]),...(p.card?['c:'+p.card]:[])]);
  ms.push({id:p.id,date:p.paidDate,val:inc?a:-a,desc:it.name+' — '+moName(p.month)+(p.note?' ('+p.note+')':''),created:p.created||0,
   kind:inc?'kira':'fatura',tags:t,method:t.includes('K')?'kart':'nakit',inc,src:'p',pay:p,it})});
 return ms;
}

 return (s?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,e))+(e<text.length?'…':'')}

  if(nameHit){const miss=[];for(let m=it.start,i=0;i<36&&m<=tk.slice(0,7);i++,m=nextMo(m))if(dueKey(it,m)<tk&&!pm.has(payId(it,m)))miss.push(moName(m));

 days.forEach(d=>{if(low(d.text).includes(q))R.push({date:d.date,tp:'Günlük',html:snip(d.text,q)})});

async function makePDF(from,to,prog){
 prog('Kayıtlar toplanıyor...');
 const [moves,notes,files,audios,dayAll]=await Promise.all([allMoves(),all('notes'),all('files'),all('audio'),all('days')]);
 const dayMap=new Map(dayAll.map(d=>[d.date,d]));
 const days=[];for(let d=parseKey(from);key(d)<=to;d.setDate(d.getDate()+1)){const k=key(d);
  const day=dayMap.get(k)||{text:'',rout:{}};
  const it={k,text:(day.text||'').trim(),rout:S.routines.filter(r=>day.rout&&day.rout[r.id]).map(r=>r.name),
   moves:moves.filter(m=>m.date===k).sort((a,b)=>(a.created||0)-(b.created||0)),notes:notes.filter(n=>n.date===k),
   files:files.filter(f=>f.date===k).sort((a,b)=>a.created-b.created),audio:audios.find(x=>x.date===k)};
  it.atext=it.audio?it.audio.segs.map(x=>x.text||'').join(' ').trim():'';
  if(it.text||it.rout.length||it.moves.length||it.notes.length||it.files.length||it.atext)days.push(it)}
 if(!days.length)return null;
 const PW=1240,PH=1754,MG=86,CW=PW-2*MG,ACC='#1f5fbf',F='"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif';
 const pages=[],outl=[];let c,x,y,title='';
 const np=cont=>{c=document.createElement('canvas');c.width=PW;c.height=PH;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);x.textBaseline='top';pages.push(c);y=MG;
  if(cont){x.font='bold 26px '+F;x.fillStyle='#888';x.fillText(title+'  (devam)',MG,y);y+=48}};
 const need=h=>{if(y+h>PH-MG-40)np(true)};
 const font=(sz,b)=>x.font=(b?'bold ':'')+sz+'px '+F;
 const wrap=(t,w)=>{const out=[];for(const p of String(t).split('\n')){let line='';for(const wd of p.split(/(\s+)/)){const tst=line+wd;
   if(x.measureText(tst).width>w&&line.trim()){out.push(line.trimEnd());line=wd.trimStart()}else line=tst;
   while(x.measureText(line).width>w&&line.length>1){let i=line.length;while(i>1&&x.measureText(line.slice(0,i)).width>w)i--;out.push(line.slice(0,i));line=line.slice(i)}}
  out.push(line.trimEnd())}return out};
 const para=(t,sz,col,ind=0,b=false)=>{font(sz,b);for(const ln of wrap(t,CW-ind)){need(sz*1.45);font(sz,b);x.fillStyle=col;x.fillText(ln,MG+ind,y);y+=sz*1.45}};
 const sec=t=>{need(110);y+=18;font(30,true);x.fillStyle=ACC;x.fillText(t,MG,y);y+=42;x.fillStyle='#d5dbe5';x.fillRect(MG,y,CW,3);y+=16};
 const fit=(t,w)=>{if(x.measureText(t).width<=w)return t;while(t.length&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
 const money=v=>(v>0?'+':v<0?'−':'')+TL(Math.abs(v))+' ₺';
 for(let di=0;di<days.length;di++){const D=days[di],dd=parseKey(D.k);prog(`Sayfalar hazırlanıyor... ${di+1}/${days.length}`);
  title=`${dd.getDate()} ${AYLAR[dd.getMonth()]} ${dd.getFullYear()} ${GUNLER[dd.getDay()]}`;
  np(false);outl.push({t:title,p:pages.length-1});
  x.fillStyle=ACC;x.fillRect(0,0,PW,14);
  font(58,true);x.fillStyle='#1b2430';x.fillText(`${dd.getDate()} ${AYLAR[dd.getMonth()]} ${dd.getFullYear()}`,MG,y);y+=72;
  font(32);x.fillStyle='#667';x.fillText(GUNLER[dd.getDay()]+'   ·   Gün Defteri',MG,y);y+=50;
  x.fillStyle=ACC;x.fillRect(MG,y,CW,5);y+=20;
  if(D.text){sec('📝 Bugün yaptıklarım');para(D.text,29,'#222')}
  if(D.moves.length){sec('💰 Para hareketleri');
   const tot=D.moves.reduce((a,m)=>a+m.val,0),cx2=MG+CW*0.6,rowH=50;
   const row=(a,b,v,bold,bg)=>{need(rowH);if(bg){x.fillStyle=bg;x.fillRect(MG,y-6,CW,rowH)}font(27,bold);x.fillStyle='#222';x.fillText(fit(a,CW*0.58),MG+10,y+4);
    font(22,bold);x.fillStyle='#667';x.fillText(fit(b,CW*0.2),cx2,y+8);font(27,true);x.fillStyle=v==null?'#222':v<0?'#c62828':'#2e7d32';
    const vt=v==null?'':money(v);x.fillText(vt,MG+CW-10-x.measureText(vt).width,y+4);y+=rowH;x.fillStyle='#e3e6ea';x.fillRect(MG,y-7,CW,1)};
   row('TOPLAM','',tot,true,'#eef2f8');
   D.moves.forEach(m=>row(m.desc||KLBL[m.kind],m.tags.map(tCode).join(' '),m.val,false))}
  if(D.notes.length){sec('📌 Notlar / Hatırlatmalar');D.notes.forEach(n=>para((n.done?'☑ ':'☐ ')+n.text,28,n.done?'#666':'#222'))}
  if(D.rout.length){sec('✅ Yapılan rutinler');para(D.rout.join('  ·  '),28,'#222')}
  if(D.atext){sec('🎙 Ses notu (yazı)');para(D.atext,27,'#333')}
  const imgs=D.files.filter(f=>f.type.startsWith('image/')),others=D.files.filter(f=>!f.type.startsWith('image/'));
  if(imgs.length){sec('📷 Fotoğraflar');const gap=28,cw=(CW-gap)/2;
   for(let i=0;i<imgs.length;i+=2){const pair=[];
    for(const f of imgs.slice(i,i+2)){try{let bm;try{bm=await createImageBitmap(f.blob,{resizeWidth:Math.round(cw),resizeQuality:'medium'})}catch(e){bm=await createImageBitmap(f.blob)}prog(`Fotoğraflar küçültülüyor... (${title})`);const h=Math.min(cw*bm.height/bm.width,760);pair.push({bm,f,w:h*bm.width/bm.height,h})}catch(e){}}
    if(!pair.length)continue;const rh=Math.max(...pair.map(p=>p.h))+48;need(rh);
    pair.forEach((p,j)=>{const ox=MG+j*(cw+gap)+(cw-p.w)/2;x.drawImage(p.bm,ox,y,p.w,p.h);x.strokeStyle='#ccd';x.lineWidth=2;x.strokeRect(ox,y,p.w,p.h);
     font(22);x.fillStyle='#555';x.fillText(fit(p.f.name||'',cw),MG+j*(cw+gap),y+p.h+10);p.bm.close&&p.bm.close()});y+=rh}}
  if(others.length){sec('📎 Diğer evraklar');others.forEach(f=>para((f.type.startsWith('video/')?'🎥 ':'📄 ')+(f.name||'adsız'),27,'#222'))}
 }
 // alt bilgi
 pages.forEach((p,i)=>{const g=p.getContext('2d');g.font='22px '+F;g.fillStyle='#999';const t=`Gün Defteri  ·  ${trDate(from)} – ${trDate(to)}  ·  Sayfa ${i+1} / ${pages.length}`;g.fillText(t,(PW-g.measureText(t).width)/2,PH-60)});
 prog('PDF yazılıyor...');
 const jp=[];for(let pi=0;pi<pages.length;pi++){const p=pages[pi];prog(`PDF yazılıyor... ${pi+1}/${pages.length}`);const b=await new Promise(r=>p.toBlob(r,'image/jpeg',0.8));p.width=p.height=1;jp.push({d:new Uint8Array(await b.arrayBuffer()),w:PW,h:PH})}
 return {blob:pdfBytes(jp,outl),days:days.length,pages:pages.length};
}
function pdfBytes(jp,outl){
 const E=new TextEncoder(),ch=[];let len=0;const off=[];const add=v=>{const u=typeof v==='string'?E.encode(v):v;ch.push(u);len+=u.length};
 const n=jp.length,m=outl.length,pg=i=>4+i*3,ct=i=>5+i*3,im=i=>6+i*3,ol=j=>4+n*3+j,N=4+n*3+m;
 const obj=(id,body)=>{off[id]=len;add(id+' 0 obj\n');add(body);add('\nendobj\n')};
 const u16=t=>'<FEFF'+[...t].map(ch=>{const c=ch.codePointAt(0);if(c>0xffff){const v=c-0x10000;return((0xD800+(v>>10)).toString(16)+(0xDC00+(v&0x3ff)).toString(16)).padStart(8,'0')}return c.toString(16).padStart(4,'0')}).join('').toUpperCase()+'>';
 add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
 obj(1,`<< /Type /Catalog /Pages 2 0 R /Outlines 3 0 R /PageMode /UseOutlines >>`);
 obj(2,`<< /Type /Pages /Kids [${jp.map((_,i)=>pg(i)+' 0 R').join(' ')}] /Count ${n} >>`);
 obj(3,m?`<< /Type /Outlines /First ${ol(0)} 0 R /Last ${ol(m-1)} 0 R /Count ${m} >>`:'<< /Type /Outlines /Count 0 >>');
 jp.forEach((p,i)=>{
  obj(pg(i),`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im(i)} 0 R >> >> /Contents ${ct(i)} 0 R >>`);
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';obj(ct(i),`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  off[im(i)]=len;add(`${im(i)} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.d.length} >>\nstream\n`);add(p.d);add('\nendstream\nendobj\n')});
 outl.forEach((o,j)=>obj(ol(j),`<< /Title ${u16(o.t)} /Parent 3 0 R${j?` /Prev ${ol(j-1)} 0 R`:''}${j<m-1?` /Next ${ol(j+1)} 0 R`:''} /Dest [${pg(o.p)} 0 R /XYZ 0 841.89 0] >>`));
 const xr=len;add(`xref\n0 ${N}\n0000000000 65535 f \n`);for(let i=1;i<N;i++)add(String(off[i]).padStart(10,'0')+' 00000 n \n');
 add(`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
 return new Blob(ch,{type:'application/pdf'});
}

async function migrateMonthly(){
 if(S.migM)return;
 if(S.monthly&&S.monthly.length){
  const pays=await all('pays');
  for(const it of S.monthly){const k='t:m'+it.id;
   if(!tagOf(k))S.tags.push({k,code:mCode(it),name:it.name});
   for(const p of pays.filter(p=>p.item===it.id)){const a=Math.abs(parseAmt(p.amount)||0),inc=it.type!=='gider';
    const extra=(p.tags||[]).filter(x=>x!=='N'&&!x.startsWith('m:'));if(p.method==='kart'&&!extra.includes('K'))extra.push('K');
    await put('money',{id:'mig_'+p.id,date:p.paidDate,amount:inc?a:-a,desc:it.name+' — '+moName(p.month)+(p.note?' ('+p.note+')':''),tags:fullTags([k,...extra]),created:p.created||Date.parse(p.paidDate)||Date.now()})}}
  S.monthlyOld=S.monthly;S.monthly=[];
 }
 S.migM=true;saveS();
}
